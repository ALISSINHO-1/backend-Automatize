name: API e PostgreSQL
on:
  pull_request:
  push:
    branches: [Alisson-Rodrigues, HML, main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: automatize
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: automatize_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U automatize -d automatize_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://automatize:test-only-password@localhost:5432/automatize_test
      TEST_DATABASE_URL: postgresql+psycopg2://automatize:test-only-password@localhost:5432/automatize_test
      JWT_SECRET_KEY: ci-test-only-secret-never-use-in-production-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Migrations em banco vazio
        run: python -m alembic upgrade head
      - name: Testes unitários e integração real
        run: python -m pytest -ra --junitxml=results.xml
      - name: Evidências dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-api
          path: results.xml
